<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f8f6;
  --surface:#ffffff;
  --border:#e8e5df;
  --border-strong:#d0ccc4;
  --text:#1a1917;
  --text-2:#6b6760;
  --text-3:#9e9b96;
  --green:#3B6D11;
  --green-light:#eaf3de;
  --green-mid:#639922;
  --red:#a32d2d;
  --red-light:#fcebeb;
  --radius:12px;
  --radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* NAV TABS */
.nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.nav-tab{flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:all .15s}
.nav-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}

/* HEADER */
.header{margin-bottom:1.5rem}
.header h1{font-size:22px;font-weight:600;letter-spacing:-0.3px}
.header p{font-size:13px;color:var(--text-2);margin-top:3px}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:5px 12px;font-size:14px;color:var(--text-2)}
.cal-nav-btn:hover{border-color:var(--border-strong);color:var(--text)}
.cal-month-label{font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1.5rem}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;transition:all .12s;position:relative;font-size:13px}
.cal-cell:hover{background:var(--surface);border-color:var(--border)}
.cal-cell.other-month{color:var(--text-3)}
.cal-cell.today{border-color:var(--green-mid)!important;font-weight:600}
.cal-cell.selected{background:var(--text);color:var(--bg)!important;border-color:var(--text)!important}
.cal-cell.has-data::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--green-mid)}
.cal-cell.selected.has-data::after{background:var(--bg)}
.cal-day-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem}
.cal-day-title{font-size:14px;font-weight:500;margin-bottom:10px}
.cal-day-meals{display:grid;gap:6px}
.cal-meal-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cal-meal-name{color:var(--text-2)}
.cal-meal-kcal{font-weight:500}

/* ── SUMMARY CARD ── */
.summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.5rem}
.summary-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.cal-big{font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1}
.cal-sub{font-size:13px;color:var(--text-2);margin-left:4px}
.cal-goal-txt{font-size:12px;color:var(--text-3)}
.progress-track{height:7px;border-radius:4px;background:#ede9e2;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;border-radius:4px;background:var(--green-mid);transition:width .4s}
.progress-fill.over{background:var(--red)}
.macros{display:grid;grid-template-columns:repeat(3,1fr)}
.macro{text-align:center;padding:0 8px}
.macro+.macro{border-left:1px solid var(--border)}
.macro-val{font-size:16px;font-weight:600}
.macro-lbl{font-size:11px;color:var(--text-3);margin-top:1px}

/* DATE STRIP (day view) */
.day-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:1.5rem;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;transition:all .15s;white-space:nowrap}
.day-pill:hover{border-color:var(--border-strong);color:var(--text)}
.day-pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* MEALS */
.meal-block{margin-bottom:1.5rem}
.meal-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.meal-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.meal-kcal{font-size:12px;color:var(--text-3)}

/* DISH */
.dish{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.dish-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.dish-icon{width:32px;height:32px;border-radius:8px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.dish-name{flex:1;font-size:14px;font-weight:500}
.dish-kcal{font-size:13px;font-weight:600;color:var(--green)}
.dish-chevron{color:var(--text-3);font-size:11px;transition:transform .2s;margin-left:2px}
.dish-chevron.open{transform:rotate(180deg)}
.dish-del{background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px 6px;border-radius:6px;font-size:13px}
.dish-del:hover{color:var(--red);background:var(--red-light)}
.dish-body{border-top:1px solid var(--border);padding:10px 14px;display:none}
.dish-body.open{display:block}
.ing-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.ing-name{flex:1;color:var(--text-2)}
.ing-input{width:62px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:right;background:var(--bg);color:var(--text);font-family:inherit}
.ing-input:focus{outline:none;border-color:var(--border-strong)}
.ing-unit{width:22px;font-size:11px;color:var(--text-3)}
.ing-kcal{width:54px;text-align:right;font-size:12px;color:var(--text-3)}

/* ADD DISH BTN */
.add-dish-btn{display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;transition:all .15s}
.add-dish-btn:hover{border-color:var(--text-2);color:var(--text);background:var(--surface)}

/* ── LIBRARY VIEW ── */
.lib-search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text);font-family:inherit;margin-bottom:1rem}
.lib-search:focus{outline:none;border-color:var(--border-strong)}
.lib-dish{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.lib-dish-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.lib-dish-icon{width:32px;height:32px;border-radius:8px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lib-dish-info{flex:1}
.lib-dish-name{font-size:14px;font-weight:500}
.lib-dish-kcal{font-size:12px;color:var(--text-3);margin-top:1px}
.lib-add-btn{background:var(--green-light);border:none;border-radius:8px;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:500;color:var(--green);font-family:inherit}
.lib-add-btn:hover{background:var(--green);color:#fff}
.lib-new-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;margin-top:6px}
.lib-new-btn:hover{border-color:var(--text-2);color:var(--text)}
.lib-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:10px;background:#ede9e2;color:var(--text-3);margin-left:6px;vertical-align:middle}
.lib-badge.custom{background:var(--green-light);color:var(--green)}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:460px;position:relative}
.modal-title{font-size:16px;font-weight:600;margin-bottom:1.25rem}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;cursor:pointer;color:var(--text-2);font-size:18px}
.form-label{font-size:12px;color:var(--text-2);margin-bottom:4px;display:block;font-weight:500}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);font-family:inherit}
.form-input:focus{outline:none;border-color:var(--border-strong)}
.form-row{margin-bottom:12px}
.ing-form-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.ing-form-row .form-input{flex:1}
.ing-form-row .form-input.sm{width:70px;flex:none}
.ing-kcal-preview{font-size:12px;color:var(--text-3);min-width:52px;text-align:right;flex-shrink:0}
.remove-ing{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:15px;padding:4px;flex-shrink:0}
.remove-ing:hover{color:var(--red)}
.suggest-wrap{position:relative;flex:1}
.suggest-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:300;max-height:180px;overflow-y:auto;display:none;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-top:2px}
.suggest-list.open{display:block}
.suggest-item{padding:8px 10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between}
.suggest-item:hover{background:var(--bg)}
.suggest-item span{color:var(--text-3);font-size:11px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1rem}
.btn-cancel{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text-2)}
.btn-save{padding:8px 18px;border:none;border-radius:var(--radius-sm);background:var(--text);color:var(--bg);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.add-ing-btn{display:flex;align-items:center;gap:4px;padding:6px 0;background:none;border:none;cursor:pointer;font-size:13px;color:var(--green);font-family:inherit}

/* add-to-day from library modal */
.meal-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.meal-pick-btn{padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.meal-pick-btn:hover{border-color:var(--green-mid);background:var(--green-light);color:var(--green)}

/* picker modal (biblioteca inline en modal) */
.picker-search{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;margin-bottom:10px}
.picker-search:focus{outline:none;border-color:var(--border-strong)}
.picker-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;transition:all .12s}
.picker-item:hover{border-color:var(--border-strong);background:var(--surface)}
.picker-item-icon{font-size:18px;flex-shrink:0}
.picker-item-info{flex:1;min-width:0}
.picker-item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item-kcal{font-size:11px;color:var(--text-3);margin-top:1px}
.picker-item-actions{display:flex;gap:6px;flex-shrink:0}
.picker-btn-add{padding:5px 10px;border:none;border-radius:6px;background:var(--green-light);color:var(--green);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.picker-btn-add:hover{background:var(--green);color:#fff}
.picker-btn-edit{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;font-family:inherit}
.picker-btn-edit:hover{border-color:var(--border-strong);color:var(--text)}
.picker-divider{display:flex;align-items:center;gap:8px;margin:10px 0}
.picker-divider::before,.picker-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.picker-divider span{font-size:11px;color:var(--text-3);white-space:nowrap}
.picker-new-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;transition:all .15s}
.picker-new-btn:hover{border-color:var(--text-2);color:var(--text);background:var(--surface)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:400;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){.app{padding:1rem .75rem 4rem}.meal-pick-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

// ════════════════════════════════════════
//  PERSISTENCIA (Firebase + localStorage como caché)
// ════════════════════════════════════════
let db_firestore = null;
const DOC_PATH = 'users/pablo';

function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db_firestore = firebase.firestore();
  }catch(e){
    console.warn('Firebase no disponible, usando localStorage', e);
  }
}

function defaultState(){
  return {days:{}, library: JSON.parse(JSON.stringify(DEFAULT_LIBRARY)), goal: DEFAULT_GOAL};
}
function getGoal(){ return (state&&state.goal)||DEFAULT_GOAL; }

function loadLocalState(){
  try{
    const s=JSON.parse(localStorage.getItem('cal_v2')||'null');
    if(s&&s.days&&s.library) return s;
  }catch(e){}
  return defaultState();
}

async function loadState(){
  // Cargar de localStorage primero (instantáneo)
  state = loadLocalState();
  render(); // render inmediato con datos locales

  // Luego sincronizar con Firebase
  if(!db_firestore) return;
  try{
    const doc = await db_firestore.doc(DOC_PATH).get();
    if(doc.exists){
      const remote = doc.data();
      if(remote && remote.days && remote.library){
        state = remote;
        localStorage.setItem('cal_v2', JSON.stringify(state));
        render();
      }
    } else {
      // Primera vez: subir el estado local a Firebase
      await db_firestore.doc(DOC_PATH).set(state);
    }
  }catch(e){
    console.warn('Error sincronizando con Firebase:', e);
  }
}

function saveState(){
  // Guardar localmente siempre (instantáneo)
  try{localStorage.setItem('cal_v2', JSON.stringify(state));}catch(e){}
  // Guardar en Firebase en segundo plano
  if(!db_firestore) return;
  db_firestore.doc(DOC_PATH).set(state).catch(e=>{
    console.warn('Error guardando en Firebase:', e);
  });
}

//  HELPERS
// ════════════════════════════════════════
function todayKey(){
  return new Date().toISOString().slice(0,10);
}
function getDayPlan(key){
  if(!state.days[key]) state.days[key]={Desayuno:[],Comida:[],Cena:[]};
  return state.days[key];
}
function calcIng(f,a){
  const db=DB[f]; if(!db||!a)return{k:0,p:0,c:0,g:0};
  const r=a/100;
  return{k:Math.round(db.k*r),p:Math.round(db.p*r),c:Math.round(db.c*r),g:Math.round(db.g*r)};
}
function calcDish(dish){
  let k=0,p=0,c=0,g=0;
  (dish.ings||[]).forEach(i=>{const n=calcIng(i.f,i.a);k+=n.k;p+=n.p;c+=n.c;g+=n.g;});
  return{k,p,c,g};
}
function calcMeal(dishes){
  let k=0,p=0,c=0,g=0;
  (dishes||[]).forEach(d=>{const n=calcDish(d);k+=n.k;p+=n.p;c+=n.c;g+=n.g;});
  return{k,p,c,g};
}
function calcDay(plan){
  let k=0,p=0,c=0,g=0;
  MEALS.forEach(m=>{const n=calcMeal(plan[m]);k+=n.k;p+=n.p;c+=n.c;g+=n.g;});
  return{k,p,c,g};
}
function fmtDate(key){
  const d=new Date(key+'T12:00:00');
  if(key===todayKey()) return 'Hoy';
  return d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
}
function fmtDateShort(key){
  const d=new Date(key+'T12:00:00');
  if(key===todayKey()) return 'Hoy';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
}
function uid(){return 'c'+Math.random().toString(36).slice(2,8);}

// ─── DAY VIEW ───
function renderDayView(){
  const plan=getDayPlan(currentDay);
  const tot=calcDay(plan);
  const pct=Math.min(100,Math.round(tot.k/getGoal()*100));

  // strip: today -3 … today +0, plus 3 future
  const keys=[];
  for(let i=-6;i<=0;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    keys.push(d.toISOString().slice(0,10));
  }

  let s=`<div class="day-strip">`;
  keys.forEach(k=>{
    const hasDot=state.days[k]&&MEALS.some(m=>(state.days[k][m]||[]).length>0);
    const lbl=fmtDateShort(k);
    s+=`<button class="day-pill${k===currentDay?' active':''}" onclick="setDay('${k}')">${lbl}${hasDot&&k!==currentDay?'·':''}</button>`;
  });
  s+=`</div>`;

  s+=`<div class="summary">
    <div class="summary-top">
      <div style="display:flex;align-items:baseline;gap:4px">
        <span class="cal-big">${tot.k}</span><span class="cal-sub">kcal</span>
      </div>
      <span class="cal-goal-txt">Meta: ${getGoal()} kcal · ${pct}%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill${tot.k>getGoal()?' over':''}" style="width:${pct}%"></div>
    </div>
    <div class="macros">
      <div class="macro"><div class="macro-val">${tot.p}g</div><div class="macro-lbl">Proteínas</div></div>
      <div class="macro"><div class="macro-val">${tot.c}g</div><div class="macro-lbl">Carbos</div></div>
      <div class="macro"><div class="macro-val">${tot.g}g</div><div class="macro-lbl">Grasas</div></div>
    </div>
  </div>`;

  MEALS.forEach(meal=>{
    const dishes=plan[meal]||[];
    const mTot=calcMeal(dishes);
    s+=`<div class="meal-block">
      <div class="meal-header">
        <span class="meal-name">${meal}</span>
        <span class="meal-kcal">${mTot.k} kcal</span>
      </div>`;
    dishes.forEach((dish,di)=>{
      const dTot=calcDish(dish);
      const key=`${meal}-${di}`;
      const open=!!expanded[key];
      s+=`<div class="dish">
        <div class="dish-header" onclick="toggleDish('${key}')">
          <div class="dish-icon">${dish.icon||'🍽️'}</div>
          <span class="dish-name">${dish.name}</span>
          <span class="dish-kcal">${dTot.k} kcal</span>
          <span class="dish-chevron${open?' open':''}">▼</span>
          <button class="dish-del" onclick="event.stopPropagation();delDish('${meal}',${di})" title="Quitar">✕</button>
        </div>
        <div class="dish-body${open?' open':''}">`;
      (dish.ings||[]).forEach((ing,ii)=>{
        const iK=calcIng(ing.f,ing.a).k;
        const unit=DB[ing.f]?.u||'g';
        s+=`<div class="ing-row">
          <span class="ing-name">${ing.f}</span>
          <input class="ing-input" type="number" min="1" step="1" value="${ing.a}"
            onchange="updateIng('${meal}',${di},${ii},this.value)"
            onclick="event.stopPropagation()" />
          <span class="ing-unit">${unit}</span>
          <span class="ing-kcal">${iK} kcal</span>
        </div>`;
      });
      s+=`</div></div>`;
    });
    s+=`<button class="add-dish-btn" onclick="openAddDish('${meal}')">＋ Añadir plato a ${meal}</button>
    </div>`;
  });
  return s;
}

// ─── CALENDAR VIEW ───
function renderCalendarView(){
  const y=calViewDate.getFullYear();
  const mo=calViewDate.getMonth();
  const monthName=calViewDate.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const firstDay=new Date(y,mo,1).getDay(); // 0=Dom
  const startOffset=(firstDay+6)%7; // adjust to Mon start
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const today=todayKey();

  let s=`<div class="cal-nav">
    <button class="cal-nav-btn" onclick="calMove(-1)">‹</button>
    <span class="cal-month-label" style="text-transform:capitalize">${monthName}</span>
    <button class="cal-nav-btn" onclick="calMove(1)">›</button>
  </div>
  <div class="cal-grid">
    ${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;

  // empty cells before month starts
  for(let i=0;i<startOffset;i++) s+=`<div class="cal-cell other-month"></div>`;

  for(let day=1;day<=daysInMonth;day++){
    const dateStr=`${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=dateStr===today;
    const isSelected=dateStr===currentDay;
    const hasData=state.days[dateStr]&&MEALS.some(m=>(state.days[dateStr][m]||[]).length>0);
    let cls='cal-cell';
    if(isToday) cls+=' today';
    if(isSelected) cls+=' selected';
    if(hasData) cls+=' has-data';
    s+=`<div class="${cls}" onclick="calSelect('${dateStr}')">${day}</div>`;
  }
  s+=`</div>`;

  // Selected day summary
  const plan=getDayPlan(currentDay);
  const tot=calcDay(plan);
  const pct=Math.min(100,Math.round(tot.k/getGoal()*100));
  const selLabel=fmtDate(currentDay);
  s+=`<div class="cal-day-summary">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="cal-day-title" style="text-transform:capitalize">${selLabel}</span>
      <button onclick="setView('day')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--green);font-family:inherit">Ver detalle →</button>
    </div>
    <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:8px">
      <span style="font-size:24px;font-weight:600">${tot.k}</span>
      <span style="font-size:13px;color:var(--text-2)">kcal · meta ${getGoal()}</span>
    </div>
    <div class="progress-track" style="margin-bottom:12px">
      <div class="progress-fill${tot.k>getGoal()?' over':''}" style="width:${pct}%"></div>
    </div>
    <div class="cal-day-meals">`;
  MEALS.forEach(meal=>{
    const dishes=plan[meal]||[];
    const mK=calcMeal(dishes).k;
    s+=`<div class="cal-meal-row">
      <span class="cal-meal-name">${meal} (${dishes.length} plato${dishes.length!==1?'s':''})</span>
      <span class="cal-meal-kcal">${mK} kcal</span>
    </div>`;
  });
  s+=`</div></div>`;
  return s;
}

// ════════════════════════════════════════
//  ACTIONS
// ════════════════════════════════════════
function setView(v){view=v;render();}
function setDay(k){currentDay=k;expanded={};if(view!=='day')view='day';render();}
function calMove(dir){calViewDate=new Date(calViewDate.getFullYear(),calViewDate.getMonth()+dir,1);render();}
function calSelect(k){currentDay=k;render();}
function toggleDish(key){expanded[key]=!expanded[key];render();}

function updateIng(meal,di,ii,val){
  const v=Math.max(1,parseInt(val)||1);
  getDayPlan(currentDay)[meal][di].ings[ii].a=v;
  saveState();render();
}
function delDish(meal,di){
  getDayPlan(currentDay)[meal].splice(di,1);
  saveState();render();
  toast('Plato eliminado');
}

// ─── PICKER: abre la biblioteca filtrada por comida (desde vista día) ───
let pickerMeal=null;
let pickerSearch='';

function openAddDish(meal){
  pickerMeal=meal;
  pickerSearch='';
  renderPickerModal();
  document.getElementById('modalBd').classList.add('open');
}

function renderPickerModal(){
  const meal=pickerMeal;
  const q=pickerSearch.toLowerCase();
  // Mostrar todos los platos de la biblioteca, primero los de esa comida
  const all=state.library.filter(d=>!q||d.name.toLowerCase().includes(q));
  const same=all.filter(d=>d.meal===meal);
  const others=all.filter(d=>d.meal!==meal);
  const mealIcons={Desayuno:'☀️',Comida:'🍽️',Cena:'🌙'};

  function dishRow(d){
    const tot=calcDish(d);
    return `<div class="picker-item">
      <span class="picker-item-icon">${d.icon||'🍽️'}</span>
      <div class="picker-item-info">
        <div class="picker-item-name">${d.name}</div>
        <div class="picker-item-kcal">${tot.k} kcal · ${tot.p}g P · ${tot.c}g C · ${tot.g}g G</div>
      </div>
      <div class="picker-item-actions">
        <button class="picker-btn-edit" onclick="openEditAndAdd('${d.id}','${meal}')" title="Editar antes de añadir">✏️</button>
        <button class="picker-btn-add" onclick="quickAddDish('${d.id}','${meal}')">Añadir</button>
      </div>
    </div>`;
  }

  let listHtml='';
  if(same.length){
    listHtml+=same.map(dishRow).join('');
  }
  if(others.length){
    listHtml+=`<div class="picker-divider"><span>Otros platos</span></div>`;
    listHtml+=others.map(dishRow).join('');
  }
  if(!all.length){
    listHtml=`<div style="text-align:center;padding:1.5rem;color:var(--text-3);font-size:13px">Sin resultados</div>`;
  }

  document.getElementById('modalEl').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${mealIcons[meal]||'🍽️'} Añadir a ${meal}</div>
    <input class="picker-search" placeholder="Buscar en la biblioteca..." value="${pickerSearch}"
      oninput="pickerSearch=this.value;renderPickerModal()" autofocus />
    <div class="picker-list">${listHtml}</div>
    <div class="picker-divider"><span>o</span></div>
    <button class="picker-new-btn" onclick="openNewDish('${meal}')">＋ Crear plato nuevo</button>`;
}

// Añadir directo sin editar
function quickAddDish(dishId,meal){
  const dish=state.library.find(d=>d.id===dishId);

  const copy={name:dish.name,icon:dish.icon,ings:dish.ings.map(i=>({...i}))};
  getDayPlan(currentDay)[meal].push(copy);
  saveState();closeModal();render();
  toast(`${dish.name} añadido ✓`);
}

    <div class="form-row">
      <label class="form-label">Comida habitual</label>
      <select class="form-input" onchange="tempDish.meal=this.value">
        ${MEALS.map(ml=>`<option value="${ml}"${tempDish.meal===ml?' selected':''}>${ml}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="form-label">Ingredientes ${totalTemp>0?`<span style="color:var(--green);font-weight:600">${totalTemp} kcal total</span>`:''}</label>
      ${ingsHtml}
      <button class="add-ing-btn" onclick="tempDish.ings.push({f:'',a:100});renderEditLibModal()">+ añadir ingrediente</button>
    </div>
    <div class="modal-footer" style="justify-content:space-between">
      <button class="btn-cancel" style="color:var(--red);border-color:var(--red)" onclick="deleteLibDish('${editingLibId}')">🗑 Eliminar</button>
      <div style="display:flex;gap:8px">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveEditLibDish()">Guardar cambios</button>
      </div>
    </div>`;
}

function refreshIngKcalLib(i){
  const ing=tempDish.ings[i];
  const el=document.getElementById('ik'+i);
  if(el){const k=calcIng(ing.f,ing.a).k;el.textContent=k>0?k+' kcal':'';}
  const total=tempDish.ings.reduce((s,j)=>s+calcIng(j.f,j.a).k,0);
  document.querySelectorAll('.form-label').forEach(l=>{
    if(l.textContent.includes('Ingredientes')){
      const sp=l.querySelector('span');
      if(sp&&total>0) sp.textContent=total+' kcal total';
    }
  });
}

function saveEditLibDish(){
  if(!tempDish.name.trim()){alert('Ponle nombre al plato');return;}
  const valid=tempDish.ings.filter(i=>i.f&&DB[i.f]);
  if(!valid.length){alert('Añade al menos un ingrediente de la lista');return;}
  const idx=state.library.findIndex(d=>d.id===editingLibId);
  if(idx===-1)return;
  state.library[idx]={
    ...state.library[idx],
    name:tempDish.name,
    meal:tempDish.meal,
    ings:valid
  };
  saveState();closeModal();render();
  toast('Plato actualizado en la biblioteca ✓');
}

function deleteLibDish(dishId){
  if(!confirm('¿Eliminar este plato de la biblioteca?'))return;
  state.library=state.library.filter(d=>d.id!==dishId);
  saveState();closeModal();render();
  toast('Plato eliminado de la biblioteca');
}

// ─── MODAL CREAR PLATO ───
let tempDish=null;
let modalMeal=null; // si viene del día, volver a esa comida

function openNewDish(meal){
  editingLibId=null;
  modalMeal=meal||null;
  tempDish={name:'',icon:'🍽️',ings:[{f:'',a:100}]};
  renderNewDishModal();
  document.getElementById('modalBd').classList.add('open');
}

function renderNewDishModal(editMode){
  const m=document.getElementById('modalEl');
  const mealCtx=modalMeal?` — ${modalMeal}`:'';
  let ingsHtml='';
  tempDish.ings.forEach((ing,i)=>{
    const iK=calcIng(ing.f,ing.a).k;
    const unit=ing.f&&DB[ing.f]?DB[ing.f].u:'g';
    ingsHtml+=`<div class="ing-form-row">
      <div class="suggest-wrap">
        <input class="form-input" id="fi${i}" placeholder="Buscar alimento..." value="${ing.f}" autocomplete="off"
          oninput="filterSug(${i},this.value)"
          onfocus="filterSug(${i},this.value)"
          onblur="setTimeout(()=>closeSug(${i}),200)" />
        <ul class="suggest-list" id="sl${i}"></ul>
      </div>
      <input class="form-input sm" type="number" min="1" step="1" value="${ing.a}" placeholder="${unit}"
        oninput="tempDish.ings[${i}].a=parseInt(this.value)||1;refreshIngKcal(${i})" />
      <span class="ing-kcal-preview" id="ik${i}">${iK>0?iK+' kcal':''}</span>
      <button class="remove-ing" onclick="tempDish.ings.splice(${i},1);renderNewDishModal(${editMode?'true':'false'})">✕</button>
    </div>`;
  });

  const totalTemp=tempDish.ings.reduce((s,i)=>s+calcIng(i.f,i.a).k,0);

  // Meal selector solo si viene de la biblioteca (no del día)
  let mealSel='';
  if(!modalMeal){
    mealSel=`<div class="form-row">
      <label class="form-label">Comida habitual</label>
      <select class="form-input" onchange="tempDish.defaultMeal=this.value">
        ${MEALS.map(ml=>`<option value="${ml}"${(tempDish.defaultMeal||'Comida')===ml?' selected':''}>${ml}</option>`).join('')}
      </select>
    </div>`;
  }

  // Si es modo edición (viene del picker), mostrar botón volver al picker
  const backBtn=editMode&&modalMeal
    ? `<button class="btn-cancel" onclick="openAddDish('${modalMeal}')">← Volver</button>`
    : `<button class="btn-cancel" onclick="closeModal()">Cancelar</button>`;

  const saveLabel=editMode?'Añadir al día':'Guardar plato';

  m.innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${editMode?'Editar y añadir':'Nuevo plato'}${mealCtx}</div>
    <div class="form-row">
      <label class="form-label">Nombre</label>
      <input class="form-input" id="dishName" placeholder="Ej: Ensalada mediterránea" value="${tempDish.name}"
        oninput="tempDish.name=this.value" />
    </div>
    ${mealSel}
    <div>
      <label class="form-label">Ingredientes ${totalTemp>0?`<span style="color:var(--green);font-weight:600">${totalTemp} kcal total</span>`:''}</label>
      ${ingsHtml}
      <button class="add-ing-btn" onclick="tempDish.ings.push({f:'',a:100});renderNewDishModal(${editMode?'true':'false'})">+ añadir ingrediente</button>
    </div>
    <div class="modal-footer">
      ${backBtn}
      <button class="btn-save" onclick="saveNewDish(${editMode?'true':'false'})">${saveLabel}</button>
    </div>`;
}

function filterSug(i,val){
  const list=document.getElementById('sl'+i);
  if(!list)return;
  const q=(val||'').toLowerCase();
  if(!q){list.classList.remove('open');return;}
  const hits=Object.keys(DB).filter(f=>f.toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){list.classList.remove('open');return;}
  list.innerHTML=hits.map(f=>`<li class="suggest-item" onmousedown="pickFood(${i},'${f}')">
    <span>${f}</span><span>${DB[f].k} kcal/100${DB[f].u}</span>
  </li>`).join('');
  list.classList.add('open');
}
function closeSug(i){const l=document.getElementById('sl'+i);if(l)l.classList.remove('open');}

function pickFood(i,food){
  tempDish.ings[i].f=food;
  // re-render el modal correcto
  if(editingLibId&&document.querySelector('.modal-title')?.textContent==='Editar plato'){
    renderEditLibModal();
  } else {
    const isEdit=document.querySelector('.modal-title')?.textContent?.startsWith('Editar y añadir');
    renderNewDishModal(!!isEdit);
  }
}

function refreshIngKcal(i){
  const ing=tempDish.ings[i];
  const el=document.getElementById('ik'+i);
  if(!el)return;
  const k=calcIng(ing.f,ing.a).k;
  el.textContent=k>0?k+' kcal':'';
  // refresh total in label — re-render is heavy, just update label text
  const totalTemp=tempDish.ings.reduce((s,j)=>s+calcIng(j.f,j.a).k,0);
  // find the label with "total" text
  const labels=document.querySelectorAll('.form-label');
  labels.forEach(l=>{if(l.textContent.includes('Ingredientes')){
    const sp=l.querySelector('span');
    if(sp&&totalTemp>0) sp.textContent=totalTemp+' kcal total';
  }});
}

function saveNewDish(editMode){
  if(!tempDish.name.trim()){alert('Ponle nombre al plato');return;}
  const valid=tempDish.ings.filter(i=>i.f&&DB[i.f]);
  if(!valid.length){alert('Añade al menos un ingrediente de la lista');return;}
  tempDish.ings=valid;

  if(editMode&&modalMeal){
    // Solo añadir al día con las modificaciones, no guardar en biblioteca
    const copy={name:tempDish.name,icon:tempDish.icon||'🍽️',ings:valid.map(i=>({...i}))};
    getDayPlan(currentDay)[modalMeal].push(copy);
    saveState();closeModal();render();
    toast(`${tempDish.name} añadido a ${modalMeal} ✓`);
  } else {
    // Guardar en biblioteca y opcionalmente añadir al día
    const dish={
      id:uid(),
      name:tempDish.name,
      icon:tempDish.icon||'🍽️',
      meal:tempDish.defaultMeal||modalMeal||'Comida',
      ings:valid
    };
    state.library.push(dish);
    if(modalMeal){
      const copy={name:dish.name,icon:dish.icon,ings:dish.ings.map(i=>({...i}))};
      getDayPlan(currentDay)[modalMeal].push(copy);
    }
    saveState();closeModal();render();
    toast(modalMeal?`${dish.name} añadido y guardado ✓`:`${dish.name} guardado en Platos ✓`);
  }
}

// ─── EDITAR META DE CALORÍAS ───
function openGoalEdit(){
  editingLibId=null;
  const m=document.getElementById('modalEl');
  m.innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">⚙️ Meta de calorías</div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:1rem">Ajusta el límite diario de calorías.</p>
    <div class="form-row">
      <label class="form-label">Calorías diarias (kcal)</label>
      <input class="form-input" id="goalInput" type="number" min="500" max="9999" step="50" value="${getGoal()}" />
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem">
      ${[1500,1800,2000,2200,2500,2800,3000,3500].map(g=>`
        <button onclick="document.getElementById('goalInput').value=${g}"
          style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:${getGoal()===g?'var(--text)':'var(--bg)'};color:${getGoal()===g?'var(--bg)':'var(--text-2)'};cursor:pointer;font-size:12px;font-family:inherit">${g}</button>
      `).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveGoal()">Guardar</button>
    </div>`;
  document.getElementById('modalBd').classList.add('open');
}

function saveGoal(){
  const val=parseInt(document.getElementById('goalInput').value);
  if(!val||val<500){alert('Introduce un valor válido (mínimo 500)');return;}
  state.goal=val;
  saveState();closeModal();render();
  toast(`Meta actualizada: ${val} kcal ✓`);
}


  document.getElementById('modalBd').classList.remove('open');
  editingLibId=null;
}

// ─── TOAST ───
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ─── INIT ───
initFirebase();
loadState();
</script>
