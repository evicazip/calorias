<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f8f6;--surface:#fff;--border:#e8e5df;--border-strong:#d0ccc4;
  --text:#1a1917;--text-2:#6b6760;--text-3:#9e9b96;
  --green:#3B6D11;--green-light:#eaf3de;--green-mid:#639922;
  --red:#a32d2d;--red-light:#fcebeb;--radius:12px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:1.5rem 1rem 5rem}
/* header */
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem}
.header h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
.header p{font-size:13px;color:var(--text-2);margin-top:3px}
.btn-goal{background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:6px 10px;font-size:12px;color:var(--text-2);font-family:inherit;white-space:nowrap;flex-shrink:0}
/* nav */
.nav{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.nav-tab{flex:1;padding:10px 4px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.nav-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
/* summary */
.summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.5rem}
.summary-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.cal-big{font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1}
.cal-sub{font-size:13px;color:var(--text-2);margin-left:4px}
.cal-goal-txt{font-size:12px;color:var(--text-3)}
.progress-track{height:7px;border-radius:4px;background:#ede9e2;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;border-radius:4px;background:var(--green-mid);transition:width .4s}
.progress-fill.over{background:var(--red)}
.macros{display:grid;grid-template-columns:repeat(3,1fr)}
.macro{text-align:center;padding:0 8px}
.macro+.macro{border-left:1px solid var(--border)}
.macro-val{font-size:16px;font-weight:600}
.macro-lbl{font-size:11px;color:var(--text-3);margin-top:1px}
/* day strip */
.day-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:1.5rem;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;white-space:nowrap;touch-action:manipulation}
.day-pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}
/* meal groups */
.meal-group{margin-bottom:1.25rem}
.meal-group-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;user-select:none}
.meal-group-left{display:flex;align-items:center;gap:8px}
.meal-group-name{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2)}
.meal-group-kcal{font-size:12px;color:var(--text-3)}
.meal-group-chevron{font-size:11px;color:var(--text-3);transition:transform .2s}
.meal-group-chevron.open{transform:rotate(180deg)}
.meal-group-body{padding-top:6px;display:none}
.meal-group-body.open{display:block}
/* dish */
.dish{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.dish-header{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.dish-icon{width:30px;height:30px;border-radius:8px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.dish-name{flex:1;font-size:14px;font-weight:500}
.dish-kcal{font-size:13px;font-weight:600;color:var(--green)}
.dish-chevron{color:var(--text-3);font-size:11px;transition:transform .2s;margin-left:2px}
.dish-chevron.open{transform:rotate(180deg)}
.dish-del{background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px 6px;border-radius:6px;font-size:13px;touch-action:manipulation}
.dish-body{border-top:1px solid var(--border);padding:10px 12px;display:none}
.dish-body.open{display:block}
.ing-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.ing-name{flex:1;color:var(--text-2);font-size:12px}
.ing-input{width:58px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:right;background:var(--bg);color:var(--text);font-family:inherit}
.ing-unit{width:20px;font-size:11px;color:var(--text-3)}
.ing-kcal{width:50px;text-align:right;font-size:12px;color:var(--text-3)}
.add-dish-btn{display:flex;align-items:center;gap:6px;width:100%;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;touch-action:manipulation;margin-top:2px}
/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:5px 14px;font-size:16px;color:var(--text-2)}
.cal-month-label{font-size:16px;font-weight:600;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1.5rem}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:4px 0;text-transform:uppercase}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;font-size:13px;position:relative}
.cal-cell.other-month{color:var(--text-3)}
.cal-cell.today{border-color:var(--green-mid);font-weight:600}
.cal-cell.selected{background:var(--text);color:var(--bg)!important;border-color:var(--text)!important}
.cal-cell.has-data::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--green-mid)}
.cal-cell.selected.has-data::after{background:var(--bg)}
.cal-day-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem}
.cal-meal-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.cal-meal-name{color:var(--text-2)}
/* library */
.lib-subtabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem}
.lib-subtab{flex:1;padding:8px 4px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.lib-subtab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
/* search - FIXED: uses controlled input via JS */
.lib-search-wrap{position:relative;margin-bottom:1rem}
.lib-search{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text);font-family:inherit;-webkit-appearance:none}
.lib-search:focus{outline:none;border-color:var(--border-strong)}
.lib-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none}
/* category groups */
.cat-group{margin-bottom:8px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.cat-group-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface);cursor:pointer;user-select:none}
.cat-group-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.cat-group-count{font-size:11px;color:var(--text-3)}
.cat-group-chevron{font-size:11px;color:var(--text-3);transition:transform .2s}
.cat-group-chevron.open{transform:rotate(180deg)}
.cat-group-body{display:none;border-top:1px solid var(--border)}
.cat-group-body.open{display:block}
/* lib cards */
.lib-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.lib-card:last-child{border-bottom:none}
.lib-icon{width:30px;height:30px;border-radius:8px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:600;color:var(--green);font-size:11px}
.lib-info{flex:1;min-width:0}
.lib-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.lib-badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:8px;background:#ede9e2;color:var(--text-3);margin-left:4px;vertical-align:middle}
.lib-badge.custom{background:var(--green-light);color:var(--green)}
.lib-actions{display:flex;gap:6px;flex-shrink:0}
.btn-edit{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn-green{padding:5px 10px;border:none;border-radius:6px;background:var(--green-light);color:var(--green);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn-green:hover,.btn-green:active{background:var(--green);color:#fff}
.lib-bottom-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lib-action-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-family:inherit;touch-action:manipulation}
.lib-action-btn.dashed{border:1.5px dashed var(--border-strong);background:transparent;color:var(--text-2)}
.lib-action-btn.green-outline{border:1.5px solid var(--green-mid);background:var(--green-light);color:var(--green);font-weight:500}
/* picker */
.picker-list{max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.picker-item-info{flex:1;min-width:0}
.picker-item-name{font-size:13px;font-weight:500}
.picker-item-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.picker-item-actions{display:flex;gap:6px;flex-shrink:0}
.picker-divider{display:flex;align-items:center;gap:8px;margin:8px 0}
.picker-divider::before,.picker-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.picker-divider span{font-size:11px;color:var(--text-3)}
/* modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:1.25rem;width:100%;max-width:460px;position:relative;margin:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:1rem;padding-right:28px}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;cursor:pointer;color:var(--text-2);font-size:20px;line-height:1;touch-action:manipulation}
.form-row{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text-2);margin-bottom:4px;display:block;font-weight:500}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);color:var(--text);font-family:inherit;-webkit-appearance:none}
.form-input:focus{outline:none;border-color:var(--border-strong)}
select.form-input{font-size:14px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ing-form-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.ing-form-row .suggest-wrap{flex:1}
.ing-form-row .form-input.sm{width:65px;flex:none;font-size:14px;padding:8px 6px;text-align:right}
.ing-kcal-preview{font-size:12px;color:var(--text-3);min-width:48px;text-align:right;flex-shrink:0}
.remove-ing{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:18px;padding:4px;flex-shrink:0;touch-action:manipulation}
.suggest-wrap{position:relative}
.suggest-list{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:400;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.suggest-list.open{display:block}
.suggest-item{padding:9px 10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active{background:var(--bg)}
.suggest-item-sub{font-size:11px;color:var(--text-3);flex-shrink:0;margin-left:6px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem}
.btn-cancel{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:14px;font-family:inherit;color:var(--text-2);touch-action:manipulation}
.btn-save{padding:8px 16px;border:none;border-radius:var(--radius-sm);background:var(--text);color:var(--bg);cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;touch-action:manipulation}
.btn-danger{padding:8px 12px;border:1px solid var(--red);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--red);touch-action:manipulation}
.add-ing-btn{display:flex;align-items:center;gap:4px;padding:8px 0;background:none;border:none;cursor:pointer;font-size:14px;color:var(--green);font-family:inherit;touch-action:manipulation}
.meal-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.meal-pick-btn{padding:12px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:14px;font-family:inherit;touch-action:manipulation}
.meal-pick-btn:active{background:var(--green-light);border-color:var(--green-mid)}
/* camera */
.camera-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:14px;color:var(--text-2);font-family:inherit;margin-bottom:12px;touch-action:manipulation}
#cameraInput{display:none}
.scan-preview{width:100%;border-radius:8px;margin-bottom:10px;max-height:200px;object-fit:cover;display:none}
.scan-result{background:var(--green-light);border:1px solid var(--green-mid);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
.scan-status{font-size:13px;color:var(--text-3);text-align:center;padding:12px 0;display:none}
/* toast */
.ep-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center}
.ep-modal.open{display:flex}
.ep-inner{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:1rem 1rem 0;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column}
.ep-header{margin-bottom:10px}
.ep-search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--text);font-family:inherit}
.ep-search:focus{outline:none;border-color:var(--border-strong)}
.ep-cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ep-cats::-webkit-scrollbar{display:none}
.ep-cat-btn{flex-shrink:0;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;font-size:18px;touch-action:manipulation}
.ep-cat-btn.active{background:var(--green-light);border-color:var(--green-mid)}
.ep-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:8px 0}
.ep-section-title{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 6px}
.ep-grid{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px}
.ep-emoji{font-size:26px;padding:4px;border:2px solid transparent;border-radius:8px;background:none;cursor:pointer;line-height:1;touch-action:manipulation;transition:transform .1s}
.ep-emoji:active{transform:scale(.85)}
.ep-sel,.ep-emoji.ep-sel{background:var(--green-light)!important;outline:2px solid var(--green-mid);border-radius:8px}
.ep-footer{display:flex;align-items:center;gap:10px;padding:10px 0 max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--border);margin-top:6px}
.ep-preview{font-size:32px;min-width:40px;text-align:center}
.ep-footer-hint{flex:1;font-size:13px;color:var(--text-3)}
.ep-confirm{padding:9px 20px;border:none;border-radius:var(--radius-sm);background:var(--text);color:var(--bg);cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;touch-action:manipulation}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:600;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:3rem 1rem;color:var(--text-3);font-size:14px}
/* emoji picker */
.ep-header{padding:12px 12px 8px;border-bottom:1px solid var(--border)}
.ep-search{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:20px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit}
.ep-search:focus{outline:none;border-color:var(--border-strong)}
.ep-cats{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.ep-cats::-webkit-scrollbar{display:none}
.ep-cat-btn{flex-shrink:0;padding:4px 8px;border:none;background:none;cursor:pointer;font-size:18px;border-radius:6px;opacity:.5;touch-action:manipulation}
.ep-cat-btn.active{background:var(--green-light);opacity:1}
.ep-body{height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
.ep-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:4px 2px 6px}
.ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-bottom:8px}
.ep-emoji{font-size:24px;padding:4px;border:none;background:none;cursor:pointer;border-radius:6px;text-align:center;touch-action:manipulation;line-height:1.3}
.ep-emoji:hover,.ep-emoji:active{background:var(--bg)}
.ep-footer{padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ep-preview{font-size:28px;width:40px;text-align:center}
.ep-footer-hint{font-size:12px;color:var(--text-3);flex:1}
.ep-confirm{padding:6px 14px;border:none;border-radius:20px;background:var(--text);color:var(--bg);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
@media(max-width:480px){.app{padding:1rem .75rem 5rem}.meal-pick-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app" id="root"><div class="loading">Cargando...</div></div>
<div class="modal-backdrop" id="modalBd"><div class="modal" id="modalEl"></div></div>
<div class="modal-backdrop" id="emojiModalBd" style="z-index:300">
  <div class="modal" id="emojiModalEl" style="max-width:360px;padding:0;overflow:hidden"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment"/>
<div class="ep-modal" id="emojiPickerModal" onclick="if(event.target===this)closeEmojiPicker()">
  <div class="ep-inner" id="emojiPickerInner"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

//  STATE
// ══════════════════════════════════════════════════════
function freshState(){
  return {
    days:{},
    dishes:JSON.parse(JSON.stringify(DISHES_DEFAULT)),
    ingredients:JSON.parse(JSON.stringify(INGREDIENTS_DEFAULT)),
    goal:DEFAULT_GOAL
  };
}
let state=null;

function getGoal(){ return (state&&state.goal)||DEFAULT_GOAL; }
function getIng(iid){ return (state.ingredients||[]).find(i=>i.id===iid); }
function getDayPlan(key){
  if(!state.days[key]) state.days[key]={Desayuno:[],Comida:[],Cena:[]};
  return state.days[key];
}
function calcIng(iid,a){
  const i=getIng(iid); if(!i||!a) return {k:0,p:0,c:0,g:0};
  const r=a/100;
  return {k:Math.round(i.kcal*r),p:Math.round((i.p||0)*r),c:Math.round((i.c||0)*r),g:Math.round((i.g||0)*r)};
}
function calcDish(dish){
  let k=0,p=0,c=0,g=0;
  (dish.ings||[]).forEach(i=>{ const n=calcIng(i.iid,i.a);k+=n.k;p+=n.p;c+=n.c;g+=n.g; });
  return {k,p,c,g};
}
function calcMeal(dishes){
  let k=0,p=0,c=0,g=0;
  (dishes||[]).forEach(d=>{ const n=calcDish(d);k+=n.k;p+=n.p;c+=n.c;g+=n.g; });
  return {k,p,c,g};
}
function calcDay(plan){
  let k=0,p=0,c=0,g=0;
  MEALS.forEach(m=>{ const n=calcMeal(plan[m]||[]);k+=n.k;p+=n.p;c+=n.c;g+=n.g; });
  return {k,p,c,g};
}

//  PERSISTENCE
// ══════════════════════════════════════════════════════
function saveLocal(){ try{localStorage.setItem('cal_v3',JSON.stringify(state));}catch(e){} }
function loadLocal(){
  try{
    const s=JSON.parse(localStorage.getItem('cal_v3')||'null');
    if(s&&s.dishes&&s.ingredients) return s;
  }catch(e){}
  return null;
}
function saveState(){ saveLocal(); if(!fsdb)return; fsdb.doc(DOC).set(state).catch(e=>console.warn(e)); }
async function loadState(){
  state=loadLocal()||freshState();
  render();
  if(!fsdb)return;
  try{
    const doc=await fsdb.doc(DOC).get();
    if(doc.exists){
      const r=doc.data();
      if(r&&r.dishes&&r.ingredients){ state=r; saveLocal(); render(); }
    } else { fsdb.doc(DOC).set(state).catch(e=>console.warn(e)); }
  }catch(e){ console.warn(e); }
}

function todayKey(){ return new Date().toISOString().slice(0,10); }
function fmtDate(key){
  const d=new Date(key+'T12:00:00');
  if(key===todayKey()) return 'Hoy';
  return d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
}
function fmtDateShort(key){
  const d=new Date(key+'T12:00:00');
  if(key===todayKey()) return 'Hoy';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
}
function uid(){ return 'c'+Math.random().toString(36).slice(2,9); }

function render(){
  if(!state){ document.getElementById('root').innerHTML='<div class="loading">Cargando...</div>'; return; }
  let html=`
  <div class="header">
    <div><h1>Calorías · Pablo 🥗</h1><p>Tu contador nutricional</p></div>
    <button class="btn-goal" onclick="openGoalEdit()">⚙️ Meta: ${getGoal()} kcal</button>
  </div>
  <div class="nav">
    <button class="nav-tab${view==='day'?' active':''}" onclick="setView('day')">📅 Día</button>
    <button class="nav-tab${view==='calendar'?' active':''}" onclick="setView('calendar')">🗓 Mes</button>
    <button class="nav-tab${view==='library'?' active':''}" onclick="setView('library')">📚 Librería</button>
  </div>`;
  if(view==='day') html+=renderDayView();
  else if(view==='calendar') html+=renderCalView();
  else html+=renderLibraryView();
  document.getElementById('root').innerHTML=html;
  // Attach search listeners without re-render (fixes mobile single-char bug)
  attachLibSearchListeners();
}

function renderLibBodyOnly(){
  const body=document.getElementById('libBody');
  if(!body) return;
  body.innerHTML = libSubTab==='dishes' ? renderDishLibBody() : renderIngLibBody();
  attachLibSearchListeners();
}

function attachLibSearchListeners(){
  const dsi=document.getElementById('libDishSearchInput');
  if(dsi){
    dsi.value=libDishSearch;
    dsi.addEventListener('input',function(){ libDishSearch=this.value; renderLibBodyOnly(); });
    dsi.addEventListener('compositionend',function(){ libDishSearch=this.value; renderLibBodyOnly(); });
  }
  const isi=document.getElementById('libIngSearchInput');
  if(isi){
    isi.value=libIngSearch;
    isi.addEventListener('input',function(){ libIngSearch=this.value; renderLibBodyOnly(); });
    isi.addEventListener('compositionend',function(){ libIngSearch=this.value; renderLibBodyOnly(); });
  }
}

//  DAY VIEW
// ══════════════════════════════════════════════════════
function renderDayView(){
  const plan=getDayPlan(currentDay), tot=calcDay(plan), goal=getGoal();
  const pct=Math.min(100,Math.round(tot.k/goal*100));
  const keys=[];
  for(let i=-6;i<=0;i++){ const d=new Date(); d.setDate(d.getDate()+i); keys.push(d.toISOString().slice(0,10)); }
  let s='<div class="day-strip">';
  keys.forEach(k=>{ s+=`<button class="day-pill${k===currentDay?' active':''}" onclick="setDay('${k}')">${fmtDateShort(k)}</button>`; });
  s+='</div>';
  s+=`<div class="summary">
    <div class="summary-top">
      <div style="display:flex;align-items:baseline;gap:4px">
        <span class="cal-big">${tot.k}</span><span class="cal-sub">kcal</span>
      </div>
      <span class="cal-goal-txt">Meta: ${goal} kcal · ${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill${tot.k>goal?' over':''}" style="width:${pct}%"></div></div>
    <div class="macros">
      <div class="macro"><div class="macro-val">${tot.p}g</div><div class="macro-lbl">Proteínas</div></div>
      <div class="macro"><div class="macro-val">${tot.c}g</div><div class="macro-lbl">Carbos</div></div>
      <div class="macro"><div class="macro-val">${tot.g}g</div><div class="macro-lbl">Grasas</div></div>
    </div>
  </div>`;
  MEALS.forEach(meal=>{
    const dishes=plan[meal]||[], mTot=calcMeal(dishes);
    const mOpen=expandedMeal[meal]!==false;
    s+=`<div class="meal-group">
      <div class="meal-group-header" onclick="toggleMeal('${meal}')">
        <div class="meal-group-left">
          <span>${MEAL_ICONS[meal]||'🍽️'}</span>
          <span class="meal-group-name">${meal}</span>
          <span class="meal-group-kcal">${mTot.k} kcal · ${dishes.length} plato${dishes.length!==1?'s':''}</span>
        </div>
        <span class="meal-group-chevron${mOpen?' open':''}">▼</span>
      </div>
      <div class="meal-group-body${mOpen?' open':''}">`;
    dishes.forEach((dish,di)=>{
      if(!dish._uid) dish._uid=uid(); // migración de platos antiguos sin uid
      const dTot=calcDish(dish), key=`${meal}-${dish._uid}`, open=!!expandedDish[key];
      s+=`<div class="dish">
        <div class="dish-header" onclick="toggleDish('${key}')">
          <div class="dish-icon">${dish.icon||'🍽️'}</div>
          <span class="dish-name">${dish.name}</span>
          <span class="dish-kcal">${dTot.k} kcal</span>
          <span class="dish-chevron${open?' open':''}">▼</span>
          <button class="btn-edit" onclick="event.stopPropagation();openEditDayDish('${meal}','${dish._uid}')" style="padding:4px 6px;font-size:13px" title="Editar ingredientes">✏️</button>
          <button class="dish-del" onclick="event.stopPropagation();delDish('${meal}','${dish._uid}')">✕</button>
        </div>
        <div class="dish-body${open?' open':''}">`;
      (dish.ings||[]).forEach((ing,ii)=>{
        const o=getIng(ing.iid), iK=calcIng(ing.iid,ing.a).k;
        s+=`<div class="ing-row">
          <span class="ing-name">${o?o.name:'?'}${o&&o.brand?` <span style="color:var(--text-3)">(${o.brand})</span>`:''}</span>
          <input class="ing-input" type="number" min="1" step="1" value="${ing.a}"
            onchange="updateIng('${meal}','${dish._uid}',${ii},this.value)" onclick="event.stopPropagation()"/>
          <span class="ing-unit">${o?o.unit:'g'}</span>
          <span class="ing-kcal">${iK} kcal</span>
        </div>`;
      });
      s+='</div></div>';
    });
    s+=`<button class="add-dish-btn" onclick="openPicker('${meal}')">＋ Añadir plato a ${meal}</button>
    </div></div>`;
  });

function renderCalView(){
  const y=calViewDate.getFullYear(),mo=calViewDate.getMonth();
  const monthName=calViewDate.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const startOffset=(new Date(y,mo,1).getDay()+6)%7;
  const daysInMonth=new Date(y,mo+1,0).getDate(), today=todayKey();
  let s=`<div class="cal-nav">
    <button class="cal-nav-btn" onclick="calMove(-1)">‹</button>
    <span class="cal-month-label">${monthName}</span>
    <button class="cal-nav-btn" onclick="calMove(1)">›</button>
  </div>
  <div class="cal-grid">
    ${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;
  for(let i=0;i<startOffset;i++) s+='<div class="cal-cell other-month"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const k=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasData=state.days[k]&&MEALS.some(m=>(state.days[k][m]||[]).length>0);
    let cls='cal-cell';
    if(k===today) cls+=' today'; if(k===currentDay) cls+=' selected'; if(hasData) cls+=' has-data';
    s+=`<div class="${cls}" onclick="calSelect('${k}')">${d}</div>`;
  }
  s+='</div>';
  const plan=getDayPlan(currentDay),tot=calcDay(plan),goal=getGoal();
  const pct=Math.min(100,Math.round(tot.k/goal*100));
  s+=`<div class="cal-day-summary">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:14px;font-weight:500;text-transform:capitalize">${fmtDate(currentDay)}</span>
      <button onclick="setView('day')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--green);font-family:inherit">Ver detalle →</button>
    </div>
    <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:8px">
      <span style="font-size:24px;font-weight:600">${tot.k}</span>
      <span style="font-size:13px;color:var(--text-2)">kcal · meta ${goal}</span>
    </div>
    <div class="progress-track" style="margin-bottom:12px">
      <div class="progress-fill${tot.k>goal?' over':''}" style="width:${pct}%"></div>
    </div>`;
  MEALS.forEach(m=>{ const mk=calcMeal(plan[m]||[]).k,dc=(plan[m]||[]).length;
    s+=`<div class="cal-meal-row"><span class="cal-meal-name">${MEAL_ICONS[m]} ${m} (${dc} plato${dc!==1?'s':''})</span><span>${mk} kcal</span></div>`;
  });
  s+='</div>';
  return s;
}

function setView(v){ view=v; render(); }
function setDay(k){ currentDay=k; expandedDish={}; if(view!=='day') view='day'; render(); }
function calMove(d){ calViewDate=new Date(calViewDate.getFullYear(),calViewDate.getMonth()+d,1); render(); }
function calSelect(k){ currentDay=k; render(); }
function setLibTab(t){ libSubTab=t; render(); }
function toggleMeal(m){ expandedMeal[m]=!expandedMeal[m]; render(); }
function toggleDish(key){ expandedDish[key]=!expandedDish[key]; render(); }
function toggleCat(k){ expandedCat[k]=expandedCat[k]===false?true:false; render(); }
function toggleLibCat(k){ expandedLibCat[k]=expandedLibCat[k]===false?true:false; render(); }

function findDishIndexByUid(meal,dishUid){
  const list=getDayPlan(currentDay)[meal]||[];
  return list.findIndex(d=>d._uid===dishUid);
}

function updateIng(meal,dishUid,ii,val){
  const v=Math.max(1,parseInt(val)||1);
  const idx=findDishIndexByUid(meal,dishUid);
  if(idx===-1) return;
  getDayPlan(currentDay)[meal][idx].ings[ii].a=v;
  saveState(); render();
}
function delDish(meal,dishUid){
  const idx=findDishIndexByUid(meal,dishUid);
  if(idx===-1) return;
  getDayPlan(currentDay)[meal].splice(idx,1);
  saveState(); render(); toast('Plato eliminado');
}

// ── Editar plato ya añadido al día (no toca la librería) ──
let editDayMeal=null, editDayUid=null, editDayDish=null;

function openEditDayDish(meal, dishUid){
  editDayMeal=meal; editDayUid=dishUid;

  if(idx===-1) return;
  // Copia profunda del plato del día para editar
  const dish=getDayPlan(currentDay)[meal][idx];
  editDayDish={name:dish.name, icon:dish.icon||'🍽️', ings:dish.ings.map(i=>({...i}))};
  renderDayDishModal();
  openModal();
}

function renderDayDishModal(){
  let ingsHtml='';
  editDayDish.ings.forEach((ing,i)=>{
    const o=getIng(ing.iid), iK=o?Math.round(o.kcal*ing.a/100):0;
    ingsHtml+=`<div class="ing-form-row">
      <div class="suggest-wrap" style="flex:1">

      </div>
      <input class="form-input sm" type="number" min="1" step="1" value="${ing.a}"
        oninput="editDayDish.ings[${i}].a=parseInt(this.value)||1;refreshDDK(${i})"/>

  });

  document.getElementById('modalEl').innerHTML=`

    ${ingsHtml}
    <button class="add-ing-btn" onclick="editDayDish.ings.push({iid:'',a:100});renderDayDishModal()">+ añadir ingrediente</button></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveDayDishModal()">Guardar</button>
    </div>`;
}

function filterDDSug(i,val){
  const list=document.getElementById('ddsl'+i); if(!list) return;
  const q=(val||'').toLowerCase();
  if(!q){list.classList.remove('open');return;}
  const hits=(state.ingredients||[]).filter(ing=>ing.name.toLowerCase().includes(q)||(ing.brand||'').toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){list.classList.remove('open');return;}
  list.innerHTML=hits.map(ing=>`<li class="suggest-item" onmousedown="pickDDIng(${i},'${ing.id}')">
    <span>${ing.name}${ing.brand?` <span style="color:var(--text-3)">${ing.brand}</span>`:''}</span>
    <span class="suggest-item-sub">${ing.kcal}/${ing.unit}</span>
  </li>`).join('');
  list.classList.add('open');
}

function pickDDIng(i,iid){
  editDayDish.ings[i].iid=iid;
  renderDayDishModal();
}

function refreshDDK(i){
  const ing=editDayDish.ings[i], o=getIng(ing.iid);
  const el=document.getElementById('ddk'+i);
  if(el){const k=o?Math.round(o.kcal*ing.a/100):0; el.textContent=k>0?k+' k':'';}
}

function saveDayDishModal(){
  const valid=editDayDish.ings.filter(i=>i.iid&&getIng(i.iid));
  if(!valid.length){alert('Añade al menos un ingrediente');return;}
  editDayDish.ings=valid;
  const idx=findDishIndexByUid(editDayMeal,editDayUid);
  if(idx===-1){ closeModal(); return; }
  const plan=getDayPlan(currentDay);
  plan[editDayMeal][idx]={...plan[editDayMeal][idx],...editDayDish};
  saveState(); closeModal(); render(); toast('Plato actualizado ✓');
}

  const same=all.filter(d=>d.meal===meal), others=all.filter(d=>d.meal!==meal);
  const row=d=>{ const tot=calcDish(d); return `<div class="picker-item">
    <span style="font-size:18px">${d.icon||'🍽️'}</span>

      <button class="btn-edit" onclick="openEditAndAdd('${d.id}','${meal}')">✏️</button>
      <button class="btn-green" onclick="quickAdd('${d.id}','${meal}')">Añadir</button>

  let listHtml=same.map(row).join('');

    pickerSearch=this.value;
    const q2=pickerSearch.toLowerCase();

    const s2=a2.filter(d=>d.meal===meal),o2=a2.filter(d=>d.meal!==meal);

function quickAdd(dishId,meal){

function saveIngModal(){
  if(!tempIng.name.trim()){ alert('El nombre es obligatorio'); return; }
  // Detección de duplicados (solo al crear, no al editar)
  if(!editingIngId){
    const nameLower=tempIng.name.toLowerCase().trim();
    const duplicate=(state.ingredients||[]).find(i=>i.name.toLowerCase().trim()===nameLower);
    if(duplicate){
      const ok=confirm(`Ya existe un ingrediente llamado "${duplicate.name}"${duplicate.brand?' ('+duplicate.brand+')':''}.\n\n¿Quieres guardarlo igualmente como otro ingrediente?\n(Si quieres editarlo, cancela y búscalo en la librería)`);
      if(!ok) return;
    }
    // También avisar si el nombre es muy parecido (>80% similar)
    else {
      const similar=(state.ingredients||[]).find(i=>{
        const a=i.name.toLowerCase().trim(), b=nameLower;
        if(Math.abs(a.length-b.length)>6) return false;
        let matches=0;
        for(let c of b) if(a.includes(c)) matches++;
        return matches/b.length>0.85 && a!==b;
      });
      if(similar){
        const ok=confirm(`Hay un ingrediente similar: "${similar.name}"${similar.brand?' ('+similar.brand+')':''}.\n\n¿Son productos distintos y quieres añadirlo igualmente?`);
        if(!ok) return;
      }
    }
  }
  if(!tempIng.emoji) tempIng.emoji=catIcon(tempIng.category||'Otros');
  if(editingIngId){
    const idx=(state.ingredients||[]).findIndex(i=>i.id===editingIngId);
    if(idx>-1) state.ingredients[idx]={...state.ingredients[idx],...tempIng};
  } else {
    if(!state.ingredients) state.ingredients=[];
    state.ingredients.push({id:uid(),...tempIng});
  }
  saveState(); closeModal(); render(); toast(editingIngId?'Ingrediente actualizado ✓':'Ingrediente guardado ✓');
}

function openScanIng(){
  document.getElementById('modalEl').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">📷 Escanear etiqueta</div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">Haz una foto a la tabla nutricional y lo añadiremos automáticamente.</p>
    <button class="camera-btn" onclick="document.getElementById('cameraInput').click()">📷 Hacer foto / elegir imagen</button>
    <img id="scanPreview" class="scan-preview"/>
    <div id="scanResult" class="scan-result"></div>
    <div id="scanStatus" class="scan-status">Analizando imagen...</div>
    <div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">Cancelar</button></div>`;
  openModal();
  document.getElementById('cameraInput').onchange=handleScan;
}
function handleScan(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    const b64=ev.target.result.split(',')[1];
    const prev=document.getElementById('scanPreview');
    if(prev){ prev.src=ev.target.result; prev.style.display='block'; }
    const stat=document.getElementById('scanStatus'); if(stat) stat.style.display='block';
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},
          {type:'text',text:'Analiza esta etiqueta nutricional. Responde SOLO con JSON válido sin texto extra:\n{"name":"nombre del producto","brand":"marca","kcal":número,"p":proteínas,"c":carbohidratos,"g":grasas,"f":fibra o 0,"unit":"g o ml","category":"categoría","weight":peso envase o null}'}
        ]}]})});
      const data=await resp.json();
      const raw=data.content.map(x=>x.text||'').join('');
      const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
      if(stat) stat.style.display='none';
      const res=document.getElementById('scanResult');
      if(res){ res.style.display='block'; res.innerHTML=`<strong>${parsed.name}</strong>${parsed.brand?' · '+parsed.brand:''}<br>${parsed.kcal} kcal · ${parsed.p||0}g P · ${parsed.c||0}g C · ${parsed.g||0}g G`; }
      tempIng={name:parsed.name||'',brand:parsed.brand||'',kcal:parsed.kcal||0,p:parsed.p||0,c:parsed.c||0,g:parsed.g||0,f:parsed.f||0,unit:parsed.unit||'g',supermarket:'',category:parsed.category||'Otros',weight:parsed.weight||null,notes:''};
      editingIngId=null;
      setTimeout(()=>{ closeModal(); renderIngModal(); openModal(); },1200);
    }catch(err){ if(stat) stat.textContent='Error al analizar. Inténtalo de nuevo.'; console.error(err); }
  };
  reader.readAsDataURL(file); e.target.value='';
}

    const isSelected=btn.textContent===e;
    btn.style.background=isSelected?'var(--green-light)':'';
    btn.style.outline=isSelected?'2px solid var(--green-mid)':'';
  });
}

function confirmEmoji(){
  if(!emojiSelected) return;
  if(emojiCallback) emojiCallback(emojiSelected);
  document.getElementById('emojiPickerModal').classList.remove('open');
}

function closeEmojiPicker(){
  document.getElementById('emojiPickerModal').classList.remove('open');
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
initFirebase();
loadState();
</script>
